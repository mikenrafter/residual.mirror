<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>residual landscape</title>
    <style>
      :root {
        --bg: #12141a;
        --surface: #1a1d26;
        --ink: #e6e8ee;
        --muted: #8b91a0;
        --line: #2a3040;
        --accent: #3d9b8f;
        --coupled: #c4a35a;
        --warn: #c45c5c;
        --mono: "IBM Plex Mono", "JetBrains Mono", "SF Mono", ui-monospace, monospace;
        --sans: "IBM Plex Sans", "Source Sans 3", "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 10% -10%, #1c2230 0%, var(--bg) 55%);
        color: var(--ink);
        font: 14px/1.45 var(--sans);
      }
      header {
        padding: 1.25rem 1.5rem 0.75rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font: 600 1.35rem/1.2 var(--mono);
        letter-spacing: 0.04em;
        text-transform: lowercase;
      }
      header p { margin: 0.35rem 0 0; color: var(--muted); max-width: 52rem; }
      main {
        display: grid;
        gap: 1.25rem;
        padding: 1.25rem 1.5rem 3rem;
      }
      @media (min-width: 1100px) {
        main { grid-template-columns: 1.1fr 1fr; align-items: start; }
        .span-all { grid-column: 1 / -1; }
      }
      section {
        background: color-mix(in srgb, var(--surface) 92%, black);
        border: 1px solid var(--line);
        padding: 1rem 1.1rem 1.15rem;
      }
      section h2 {
        margin: 0 0 0.75rem;
        font: 600 0.78rem/1.2 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input[data-force-filter],
      input[type="text"],
      textarea,
      select {
        width: 100%;
        background: #0e1016;
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 0.45rem 0.55rem;
        font: 13px/1.35 var(--mono);
        margin: 0 0 0.55rem;
      }
      textarea { min-height: 4rem; resize: vertical; }
      label {
        display: block;
        font: 600 0.72rem/1.2 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0.35rem 0 0.2rem;
      }
      .attractor-group { margin: 0.85rem 0 0; }
      .attractor-group > h3 {
        margin: 0 0 0.4rem;
        font: 600 0.85rem/1.3 var(--mono);
        color: var(--accent);
      }
      .force-row, .component-chip {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.35rem 0.75rem;
        padding: 0.45rem 0.5rem;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .force-row[hidden], .component-chip[hidden], .attractor-group[hidden] { display: none; }
      .force-id { color: var(--coupled); }
      .force-kind { color: var(--muted); text-transform: uppercase; font-size: 0.68rem; }
      table.matrix {
        width: 100%;
        border-collapse: collapse;
        font: 12px/1.2 var(--mono);
      }
      table.matrix th, table.matrix td {
        border: 1px solid var(--line);
        padding: 0.35rem 0.45rem;
        text-align: center;
      }
      table.matrix th { color: var(--muted); font-weight: 600; }
      [data-residue-cell][data-coupled="1"] {
        background: color-mix(in srgb, var(--coupled) 28%, transparent);
        color: var(--coupled);
        font-weight: 700;
      }
      .generators {
        display: grid;
        gap: 0.85rem;
      }
      @media (min-width: 800px) {
        .generators { grid-template-columns: 1fr 1fr; }
      }
      form[data-command-generator] {
        border: 1px solid var(--line);
        padding: 0.75rem;
        background: #12151d;
      }
      form[data-command-generator] legend {
        font: 600 0.78rem/1 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        padding: 0 0.25rem;
      }
      button {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        font: 600 0.75rem/1 var(--mono);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.45rem 0.7rem;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      #staged-commands {
        width: 100%;
        min-height: 8rem;
        background: #0a0c10;
        color: #cfd6e4;
        border: 1px solid var(--line);
        font: 12.5px/1.45 var(--mono);
        padding: 0.65rem;
        white-space: pre;
      }
      .copy-bar { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
      .defense-records { margin-top: 0.75rem; font: 12.5px/1.4 var(--mono); color: var(--muted); }
      .defense-records li { margin: 0.2rem 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>residual</h1>
      <p>Read-only force landscape. Stage <code>residual add …</code> commands here; run them yourself. Nothing on this page mutates the ledger.</p>
    </header>
    <main>
      <section data-view="force-list">
        <h2>Forces</h2>
        <input
          type="search"
          data-force-filter
          placeholder="filter by id, shortname, kind, attractor, architecture_set…"
          aria-label="Filter forces"
        />
        {{FORCE_LIST}}
      </section>

      <section data-view="matrix">
        <h2>Residue matrix</h2>
        {{MATRIX}}
      </section>

      <section class="span-all">
        <h2>Stage adds</h2>
        <div class="generators">
          <form data-command-generator="stressor">
            <fieldset>
              <legend>stressor</legend>
              <label>description</label>
              <input name="description" type="text" required />
              <label>attractor-id</label>
              <input name="attractor_id" type="text" required />
              <label>naive-change</label>
              <input name="naive_change" type="text" required />
              <label>shortname</label>
              <input name="shortname" type="text" />
              <label>outcomes</label>
              <input name="outcomes" type="text" />
              <button type="submit">stage</button>
            </fieldset>
          </form>
          <form data-command-generator="purpose">
            <fieldset>
              <legend>purpose</legend>
              <label>description</label>
              <input name="description" type="text" required />
              <label>attractor-id</label>
              <input name="attractor_id" type="text" required />
              <label>naive-change</label>
              <input name="naive_change" type="text" required />
              <label>shortname</label>
              <input name="shortname" type="text" />
              <label>outcomes</label>
              <input name="outcomes" type="text" />
              <button type="submit">stage</button>
            </fieldset>
          </form>
          <form data-command-generator="attractor">
            <fieldset>
              <legend>attractor</legend>
              <label>name</label>
              <input name="name" type="text" required />
              <label>description</label>
              <input name="description" type="text" required />
              <label>positive-state</label>
              <input name="positive_state" type="text" required />
              <label>negative-state</label>
              <input name="negative_state" type="text" required />
              <button type="submit">stage</button>
            </fieldset>
          </form>
          <form data-command-generator="component">
            <fieldset>
              <legend>component</legend>
              <label>name</label>
              <input name="name" type="text" required />
              <label>description</label>
              <input name="description" type="text" required />
              <label>status</label>
              <input name="status" type="text" required />
              <label>architecture-set</label>
              <input name="architecture_set" type="text" required />
              <button type="submit">stage</button>
            </fieldset>
          </form>
          {{DEFENSE_FORMS}}
        </div>
      </section>

      <section class="span-all" data-copy-commands>
        <h2>Copy commands</h2>
        <div class="copy-bar">
          <button type="button" id="copy-staged">copy</button>
          <button type="button" id="clear-staged">clear</button>
        </div>
        <textarea id="staged-commands" readonly placeholder="staged residual add … commands appear here"></textarea>
      </section>
    </main>

    <script id="residual-snapshot" type="application/json">{{SNAPSHOT_JSON}}</script>
    <script>
      function shellQuote(value) {
        const s = String(value == null ? "" : value);
        if (s.indexOf("\n") !== -1 || s.indexOf("\r") !== -1) {
          let escaped = "";
          for (const ch of s) {
            if (ch === "\\") escaped += "\\\\";
            else if (ch === "'") escaped += "\\'";
            else if (ch === "\n") escaped += "\\n";
            else if (ch === "\r") escaped += "\\r";
            else if (ch === "\t") escaped += "\\t";
            else escaped += ch;
          }
          return "$'" + escaped + "'";
        }
        return "'" + s.replace(/'/g, "'\\''") + "'";
      }

      function pushFlag(parts, flag, value) {
        parts.push(flag + " " + shellQuote(value));
      }

      function pushOptionalFlag(parts, flag, value) {
        if (value != null && String(value) !== "") pushFlag(parts, flag, value);
      }

      function buildAddCommand(target, fields) {
        const f = fields || {};
        const parts = ["residual add " + target];
        switch (target) {
          case "stressor":
          case "purpose":
          case "meta-purpose":
            pushFlag(parts, "--description", f.description || "");
            pushFlag(parts, "--attractor-id", f.attractor_id || "");
            pushFlag(parts, "--naive-change", f.naive_change || "");
            pushOptionalFlag(parts, "--shortname", f.shortname || "");
            pushOptionalFlag(parts, "--outcomes", f.outcomes || "");
            break;
          case "attractor":
          case "meta-attractor":
            pushFlag(parts, "--name", f.name || "");
            pushFlag(parts, "--description", f.description || "");
            pushFlag(parts, "--positive-state", f.positive_state || "");
            pushFlag(parts, "--negative-state", f.negative_state || "");
            break;
          case "component":
            pushFlag(parts, "--name", f.name || "");
            pushFlag(parts, "--description", f.description || "");
            pushFlag(parts, "--status", f.status || "");
            pushFlag(parts, "--architecture-set", f.architecture_set || "");
            break;
          case "meta-stressor":
            pushFlag(parts, "--description", f.description || "");
            pushOptionalFlag(parts, "--shortname", f.shortname || "");
            break;
          case "defense-persona":
          case "defense-strategy":
          case "defense-progress":
          case "defense-pitch":
            pushFlag(parts, "--name", f.name || "");
            pushFlag(parts, "--body", f.body || "");
            break;
          default:
            throw new Error("unknown add target: " + target);
        }
        return parts.join(" ");
      }

      function formFields(form) {
        const data = {};
        for (const el of form.querySelectorAll("input, textarea, select")) {
          if (!el.name) continue;
          data[el.name] = el.value;
        }
        return data;
      }

      function appendStaged(command) {
        const box = document.getElementById("staged-commands");
        box.value = box.value ? box.value + "\n" + command : command;
      }

      document.querySelectorAll("form[data-command-generator]").forEach((form) => {
        form.addEventListener("submit", (ev) => {
          ev.preventDefault();
          const target = form.getAttribute("data-command-generator");
          appendStaged(buildAddCommand(target, formFields(form)));
        });
      });

      const filterInput = document.querySelector("[data-force-filter]");
      if (filterInput) {
        filterInput.addEventListener("input", () => {
          const q = filterInput.value.trim().toLowerCase();
          document.querySelectorAll(".force-row, .component-chip").forEach((row) => {
            const hay = (row.getAttribute("data-search") || row.textContent || "").toLowerCase();
            row.hidden = q !== "" && hay.indexOf(q) === -1;
          });
          document.querySelectorAll("[data-attractor-group]").forEach((group) => {
            const visible = group.querySelectorAll(".force-row:not([hidden])").length > 0;
            group.hidden = q !== "" && !visible;
          });
        });
      }

      const copyBtn = document.getElementById("copy-staged");
      if (copyBtn) {
        copyBtn.addEventListener("click", async () => {
          const box = document.getElementById("staged-commands");
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(box.value);
          } else {
            box.select();
            document.execCommand("copy");
          }
        });
      }
      const clearBtn = document.getElementById("clear-staged");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          document.getElementById("staged-commands").value = "";
        });
      }
    </script>
  </body>
</html>
